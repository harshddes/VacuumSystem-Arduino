="1.4" fill="none" /><line x1="667" x2="778" y1="402" y2="402" stroke="#111111" stroke-width="1.4" fill="none" /><line x1="660" x2="669" y1="389" y2="380" stroke="#111111" stroke-width="1" fill="none" /><polyline points="664,380 669,380 669,385" stroke="#111111" stroke-width="1" fill="none" /><line x1="670" x2="679" y1="389" y2="380" stroke="#111111" stroke-width="1" fill="none" /><polyline points="674,380 679,380 679,385" stroke="#111111" stroke-width="1" fill="none" /><text x="624" y="435" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start">Disarmed / rejected</text><text x="778" y="449" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="middle">GND</text><line x1="778" x2="778" y1="426" y2="432" stroke="#111111" stroke-width="1.4" fill="none" /><line x1="771" x2="785" y1="432" y2="432" stroke="#111111" stroke-width="1.4" fill="none" /><line x1="773" x2="783" y1="436" y2="436" stroke="#111111" stroke-width="1.4" fill="none" /><line x1="776" x2="780" y1="440" y2="440" stroke="#111111" stroke-width="1.4" fill="none" /><text x="30" y="510" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Every switch connects its pin to GND when asserted. OPEN requests start released; press/reset, then make a fresh request.</text><text x="30" y="525" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">LEDs represent logical permission, not valve position. Other pump valves are combined into one simulated input in this desk demo.</text><text x="30" y="540" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">The included sketch is a teaching / logic test artifact. It does not implement physical motion timing, real pressure or field fault handling.</text></svg>