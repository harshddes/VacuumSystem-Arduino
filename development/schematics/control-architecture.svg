<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="1263" height="892" role="img"><title>Uno R3 decisions; separate field interfaces</title><rect x="0" y="0" width="1263" height="892" fill="white" /><text x="30" y="30" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Uno R3 decisions; separate field interfaces</text><text x="30" y="50" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start">Functional electrical / pneumatic architecture · this is not a connector pinout or released coil wiring.</text><line x1="30" x2="812" y1="62" y2="62" stroke="#D8D8D4" stroke-width="1.4" fill="none" /><line x1="30" x2="812" y1="556" y2="556" stroke="#D8D8D4" stroke-width="1.4" fill="none" /><text x="30" y="574" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">MAIZE  |  Uno R3  |  9 Oct 2026  |  Concept / bench only; not a field wiring release</text><text x="812" y="574" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end">3 / 4</text><rect x="30" y="100" width="195" height="65" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="40" y="118" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Panel requests</text><text x="40" y="134" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">MANUAL / OFF / AUTO; ARM</text><text x="40" y="146" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Existing switches: contacts to verify</text><rect x="30" y="202" width="195" height="71" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="40" y="220" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Physical position proofs</text><text x="40" y="236" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">OPEN and CLOSED per valve</text><text x="40" y="248" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Electrical type / healthy state: TBD</text><rect x="30" y="311" width="195" height="65" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="40" y="329" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Equipment readiness</text><text x="40" y="345" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Cryo cold; turbo ready; backing</text><text x="40" y="357" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Pumps keep their existing controls</text><rect x="294" y="204" width="160" height="117" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="304" y="222" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Arduino Uno R3</text><text x="304" y="238" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">One permission function</text><text x="304" y="250" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Manual requests now</text><text x="304" y="262" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Sequence requests later</text><text x="304" y="274" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Boot: opening inhibited</text><rect x="294" y="100" width="160" height="59" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="304" y="118" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Readout: laptop first</text><text x="304" y="134" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Pressure + unit + validity</text><text x="304" y="146" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Panel readout in final assembly</text><rect x="30" y="417" width="195" height="67" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="40" y="435" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Commercial gauge/controller</text><text x="40" y="451" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Hornet IGM402YFD + CG</text><text x="40" y="463" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Model / protocol / range: verify</text><rect x="272" y="417" width="188" height="67" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="282" y="435" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Conditioned pressure interface</text><text x="282" y="451" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Hornet RS485; isolated interface</text><text x="282" y="463" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Validate channel, units and age</text><rect x="520" y="204" width="120" height="88" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="530" y="222" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Rated coil driver</text><text x="530" y="238" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Independent inhibit</text><text x="530" y="250" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Load + suppression</text><text x="530" y="262" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">matched to pilot</text><rect x="690" y="204" width="120" height="88" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="700" y="222" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Pilot solenoid</text><text x="700" y="238" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">One or two coils?</text><text x="700" y="250" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Spool / ports: TBD</text><text x="700" y="262" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Voltage: TBD</text><rect x="515" y="100" width="185" height="59" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="525" y="118" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Separate field power</text><text x="525" y="134" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Rated supply + protection</text><text x="525" y="146" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Uno R3 does not power the coil</text><rect x="600" y="335" width="210" height="62" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="610" y="353" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Regulated actuator gas</text><text x="610" y="369" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Correct gas and pressure from manual</text><text x="610" y="381" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Supply loss / stored energy: assess</text><rect x="570" y="428" width="240" height="56" rx="0" stroke="#404040" stroke-width="1.2" fill="white" /><text x="580" y="446" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">Gate actuator + position sensors</text><text x="580" y="462" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Actual motion must agree with command</text><text x="580" y="474" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Fail position depends on installed hardware</text><polyline points="225,132 258,132 258,250 294,250" stroke="#404040" stroke-width="1" fill="none" /><polyline points="225,237 258,237 258,250 294,250" stroke="#404040" stroke-width="1" fill="none" /><polyline points="225,344 258,344 258,250 294,250" stroke="#404040" stroke-width="1" fill="none" /><text x="30" y="394" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Field inputs require appropriate conditioning / isolation.</text><line x1="374" x2="374" y1="204" y2="159" stroke="#1F6F5F" stroke-width="1.6" fill="none" stroke-dasharray="4 3" /><line x1="454" x2="520" y1="248" y2="248" stroke="#1F6F5F" stroke-width="1.6" fill="none" stroke-dasharray="4 3" /><line x1="640" x2="690" y1="248" y2="248" stroke="#111111" stroke-width="2" fill="none" /><polyline points="578,159 578,204" stroke="#111111" stroke-width="2" fill="none" /><polyline points="750,335 750,292" stroke="#404040" stroke-width="1.8" fill="none" /><polyline points="810,260 822,260 822,413 735,413 735,428" stroke="#404040" stroke-width="1.8" fill="none" /><line x1="225" x2="272" y1="450" y2="450" stroke="#1F6F5F" stroke-width="1.4" fill="none" stroke-dasharray="4 3" /><polyline points="366,417 366,321" stroke="#1F6F5F" stroke-width="1.6" fill="none" /><text x="370" y="366" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Validated data</text><line x1="30" x2="812" y1="502" y2="502" stroke="#D8D8D4" stroke-width="1.4" fill="none" /><text x="30" y="519" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Signals: fine lines; Uno R3 output/display links dashed. Coil power: heavy lines. Pneumatic route: grey heavy line at right.</text><text x="30" y="535" fill="#404040" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">OPEN drive needs independent supervision. Position proofs return through inputs. Cryogenic services are separate.</text></svg>