<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1760" height="878" viewBox="0 0 1760 878" role="img" aria-labelledby="title description">
  <title id="title">MAIZE Opta front panel</title>
  <desc id="description">Concept for the existing 19 inch 4U faceplate with four valve selectors, three-position mode selector, blue arm/reset, white pumpdown, yellow vent start, red close/stop, green control power, red fault and a compact blue 20 by 4 character display.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#2b343c"/>
      <stop offset="1" stop-color="#202930"/>
    </linearGradient>
    <linearGradient id="chrome" x2="0" y2="1">
      <stop stop-color="#f3f6f8"/>
      <stop offset=".45" stop-color="#9ba8b1"/>
      <stop offset=".65" stop-color="#52616a"/>
      <stop offset="1" stop-color="#c5d0d6"/>
    </linearGradient>
    <radialGradient id="green">
      <stop stop-color="#8be5a9"/>
      <stop offset=".72" stop-color="#47b87a"/>
      <stop offset="1" stop-color="#247c55"/>
    </radialGradient>
    <radialGradient id="red-off">
      <stop stop-color="#904d51"/>
      <stop offset="1" stop-color="#59292f"/>
    </radialGradient>
    <linearGradient id="lcd" x2="0" y2="1">
      <stop stop-color="#284982"/>
      <stop offset="1" stop-color="#182956"/>
    </linearGradient>
    <g id="selector">
      <circle r="50.86" fill="#10161a" stroke="#56626b" stroke-width="1.6"/>
      <circle r="43.5" fill="#343d44" stroke="#0c1115" stroke-width="4"/>
      <rect x="-12" y="-35" width="24" height="70" rx="9" fill="#151d22" stroke="#646f76" stroke-width="1.5"/>
      <path d="M0-29v16" stroke="#c5d0d5" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g id="button">
      <circle r="50.86" fill="#11171c" stroke="#56626b" stroke-width="1.6"/>
      <circle r="38" fill="currentColor" stroke="#080d10" stroke-opacity=".6" stroke-width="3"/>
      <path d="M-24-17C-14-26 11-28 23-19" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="screw">
      <circle r="5.5" fill="#9fadb8" stroke="#36444e" stroke-width="1.3"/>
      <path d="M-2.5 0h5M0-2.5v5" stroke="#3c4d57" stroke-width="1.15"/>
    </g>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif }
      .heading { font-size: 41px; font-weight: 700; fill: #152731 }
      .subheading { font-size: 18px; fill: #435661 }
      .face-title { fill: #c2d1d8; font-size: 17px; font-weight: 700; letter-spacing: 1.8px }
      .label { fill: #f2f6f7; font-size: 18px; font-weight: 700; letter-spacing: .4px }
      .small-label { fill: #bac9d0; font-size: 13px; letter-spacing: .55px }
      .screen { fill: #e0f3ff; font-family: 'DejaVu Sans Mono', monospace; font-size: 16.5px; letter-spacing: .8px }
      .divider { stroke: #54636c; stroke-opacity: .67; stroke-width: 1.4 }
    </style>
  </defs>
  <rect width="1760" height="878" fill="#edf1f3"/>
  <text x="50" y="76" class="heading">MAIZE vacuum controls</text>
  <text x="51" y="113" class="subheading">Opta WiFi front panel with 20 × 4 local status display</text>
  <text x="1708" y="76" class="heading" text-anchor="end" style="font-size:26px">19 in / 4U</text>
  <text x="1708" y="111" class="subheading" text-anchor="end">Concept using the reference faceplate</text>

  <rect x="50" y="164" width="1664" height="608" rx="10" fill="#adbac2"/>
  <rect x="48" y="156" width="1664" height="608" rx="10" fill="url(#panel)" stroke="#10171c" stroke-width="2"/>
  <g fill="#11171c" stroke="#667681" stroke-width="1.4">
    <rect x="62" y="192" width="30" height="15" rx="4"/>
    <rect x="62" y="713" width="30" height="15" rx="4"/>
    <rect x="1667" y="192" width="30" height="15" rx="4"/>
    <rect x="1667" y="713" width="30" height="15" rx="4"/>
  </g>

  <g transform="translate(180 241)">
    <circle r="50.86" fill="url(#chrome)" stroke="#10181d" stroke-width="1.6"/>
    <circle r="39" fill="url(#green)" stroke="#415e59" stroke-width="2"/>
    <path d="M-23-21Q-9-34 12-27" fill="none" stroke="#ecfff3" stroke-opacity=".57" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="245" y="248" class="label">CONTROL POWER</text>
  <g transform="translate(526 241)">
    <circle r="50.86" fill="url(#chrome)" stroke="#10181d" stroke-width="1.6"/>
    <circle r="39" fill="url(#red-off)" stroke="#74454d" stroke-width="2"/>
    <path d="M-23-21Q-9-34 12-27" fill="none" stroke="#df9898" stroke-opacity=".45" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="590" y="248" class="label">FAULT</text>
  <line x1="123" y1="312" x2="941" y2="312" class="divider"/>

  <text x="123" y="339" class="face-title">MANUAL VALVE REQUESTS</text>
  <g text-anchor="middle">
    <text x="180" y="373" class="label">ROUGHING</text>
    <text x="389" y="373" class="label">LET-UP</text>
    <text x="598" y="373" class="label">TURBO</text>
    <text x="807" y="373" class="label">CRYO</text>
    <use xlink:href="#selector" transform="translate(180 438) rotate(-40)"/>
    <use xlink:href="#selector" transform="translate(389 438) rotate(-40)"/>
    <use xlink:href="#selector" transform="translate(598 438) rotate(40)"/>
    <use xlink:href="#selector" transform="translate(807 438) rotate(-40)"/>
    <text x="180" y="513" class="small-label">CLOSE / OPEN</text>
    <text x="389" y="513" class="small-label">CLOSE / OPEN</text>
    <text x="598" y="513" class="small-label">CLOSE / OPEN</text>
    <text x="807" y="513" class="small-label">CLOSE / OPEN</text>
  </g>
  <line x1="123" y1="543" x2="941" y2="543" class="divider"/>

  <g text-anchor="middle">
    <text x="180" y="580" class="label">MODE</text>
    <text x="389" y="580" class="label">ARM / RESET</text>
    <text x="598" y="580" class="label">PUMPDOWN</text>
    <text x="807" y="580" class="label">VENT START</text>
    <use xlink:href="#selector" transform="translate(180 646) rotate(-45)"/>
    <use xlink:href="#button" x="389" y="646" color="#377fbc"/>
    <use xlink:href="#button" x="598" y="646" color="#ecf2f5"/>
    <use xlink:href="#button" x="807" y="646" color="#eac54a"/>
    <text x="180" y="723" class="small-label">MAN / OFF / AUTO</text>
  </g>

  <line x1="994" y1="207" x2="994" y2="725" class="divider"/>
  <text x="1334" y="258" text-anchor="middle" class="face-title">LOCAL STATUS</text>
  <g transform="translate(1163 280)">
    <rect width="342" height="210.5" rx="4" fill="#131b20" stroke="#687881" stroke-width="1.4"/>
    <rect x="30" y="28" width="282" height="109" rx="3.5" fill="#354050" stroke="#090e15" stroke-width="2"/>
    <rect x="38" y="37" width="266" height="92" rx="2" fill="url(#lcd)" stroke="#111d37" stroke-width="1.2"/>
    <text x="50" y="56" class="screen">MANUAL / ARMED</text>
    <text x="50" y="77" class="screen">P 1.00E-5 TORR</text>
    <text x="50" y="98" class="screen">TURBO OPEN PROVEN</text>
    <text x="50" y="119" class="screen">CRYO CLOSED PROVEN</text>
    <use xlink:href="#screw" x="16" y="16"/>
    <use xlink:href="#screw" x="326" y="16"/>
    <use xlink:href="#screw" x="16" y="194"/>
    <use xlink:href="#screw" x="326" y="194"/>
    <g fill="#364653" stroke="#7c8991">
      <rect x="193" y="163" width="24" height="23" rx="1.5"/>
      <rect x="229" y="163" width="24" height="23" rx="1.5"/>
      <rect x="265" y="163" width="24" height="23" rx="1.5"/>
    </g>
    <g fill="#d8e3e9">
      <path d="m199 177 6-6 6 6zm36-4 6 6 6-6z"/>
      <path d="M272 177h10v-6m-10 6 3-3m-3 3 3 3" fill="none" stroke="#d8e3e9" stroke-width="1.2"/>
    </g>
    <text x="33" y="181" class="small-label">VP-EC-RDU-MINI</text>
  </g>
  <text x="1334" y="515" text-anchor="middle" class="small-label">20 × 4 CHARACTERS · SAMPLE DATA</text>
  <use xlink:href="#button" x="1260" y="646" color="#c74d52"/>
  <text x="1327" y="652" class="label">CLOSE / STOP</text>

  <text x="50" y="819" class="subheading">Control faces Ø29.5 mm. LCD face approximately 99 × 61 mm. Fuse holder is inside the cabinet.</text>
  <text x="50" y="849" class="subheading">Use the templates supplied with the physical parts for cutouts and mounting holes.</text>
</svg>
